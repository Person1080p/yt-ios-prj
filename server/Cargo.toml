[package]
name = "ytp-server"
version = "0.1.0"
edition = "2021"
description = "Self-hosted music player backend: YouTube Music + yt-dlp + Plex + Last.fm"

[[bin]]
name = "ytp-server"
path = "src/main.rs"

[features]
default = ["embedded-tailscale"]
# Bake a yt-dlp binary (placed at server/vendor/yt-dlp) into the server executable.
embed-ytdlp = []
# Run a Tailscale node inside the server process (tsnet, compiled from server/tsnet-ffi; needs Go
# at build time). On by default; build with --no-default-features to leave it out.
embedded-tailscale = []

[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["macros"] }
base64 = "0.22"
bytes = "1"
csv = "1"
dotenvy = "0.15"
futures = "0.3"
hex = "0.4"
md-5 = "0.10"
rand = "0.8"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "gzip"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-util = { version = "0.7", features = ["io"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["fs", "trace", "cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
urlencoding = "2"
uuid = { version = "1", features = ["v4"] }

zip = { version = "9.4.0", default-features = false, features = ["deflate"] }
flate2 = "1.1.10"
plist = "1.10.3"

[profile.release]
lto = "thin"
strip = true
