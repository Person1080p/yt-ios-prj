# XcodeGen project definition.
#
#   make project      # or: xcodegen generate
#
# The .xcodeproj is generated, not committed — this file is the source of truth
# and is reviewable as text.

name: Aura

options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: false

configs:
  Debug: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: "5.9"
    # 'complete' is noisy for a UIKit/SwiftUI app; 'targeted' still catches the
    # cases that matter.
    SWIFT_STRICT_CONCURRENCY: targeted
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEVELOPMENT_LANGUAGE: en
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    # Set DEVELOPMENT_TEAM here, or let Xcode pick your team on first open.
    CODE_SIGN_STYLE: Automatic
  configs:
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
      ONLY_ACTIVE_ARCH: YES
    Release:
      SWIFT_COMPILATION_MODE: wholemodule

targets:

  Aura:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Core
      - path: UI
      - path: CarPlay
      # NOTE: Support/ is deliberately absent. It holds platform stand-ins for
      # the SwiftPM test harness and would collide with the real types here.
    settings:
      base:
        PRODUCT_NAME: Aura
        PRODUCT_BUNDLE_IDENTIFIER: com.example.aura
        PRODUCT_MODULE_NAME: Aura
        INFOPLIST_FILE: App/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SUPPORTS_MACCATALYST: NO
        # Declares com.apple.developer.carplay-audio. Signing FAILS while that
        # entitlement is unapproved for your account — run `make no-carplay` to
        # generate a project without it while you wait.
        CODE_SIGN_ENTITLEMENTS: App/Aura.entitlements

  AuraTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: Aura
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.aura.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:

  Aura:
    build:
      targets:
        Aura: all
        AuraTests: [test]
    run:
      config: Debug
      # Handy when debugging the CarPlay scene attaching before the phone UI.
      environmentVariables:
        OS_ACTIVITY_MODE: default
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - AuraTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
